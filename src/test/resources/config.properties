# Default configuration, mirroring ../config.properties/config.properties.robot.
# Override any key with a system property (mvnw test -DHEADLESS=true)
# or an environment variable of the same name.

# API: https://reqres.in
REQRES_BASE_URL=https://reqres.in/api
REQRES_API_KEY=reqres-free-v1
REQRES_TIMEOUT=30

# UI: https://www.saucedemo.com (public demo credentials)
SAUCEDEMO_URL=https://www.saucedemo.com/
SAUCE_USER=standard_user
SAUCE_PASSWORD=secret_sauce
# chrome or msedge (installed browsers), or chromium, firefox, webkit
# (Playwright's bundled builds, downloaded automatically on first use)
UI_BROWSER=chrome
UI_TIMEOUT=10s
# true / false. Off by default so the browser window is visible.
HEADLESS=false
